name: f1_pet_project
description: F1 stats app (Jolpica + ESPN). MobX, Provider, Auto Route, Dio.

publish_to: "none"

version: 1.9.3+202607292

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  appmetrica_plugin: ^4.0.0
  auto_route: ^11.1.0
  collection: any
  colorful_safe_area: ^1.0.0
  dio: ^5.11.0
  envied: ^1.3.8
  firebase_analytics: ^12.4.5
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  firebase_remote_config: ^6.5.5
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_localizations:
    sdk: flutter
  flutter_mobx: ^2.3.0
  flutter_timezone: ^5.1.0
  fluttertoast: ^9.1.0
  geolocator: ^14.0.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  loading_animation_widget: ^1.3.0
  logger: ^2.6.1
  mobx: ^2.5.0
  package_info_plus: ^10.2.1
  permission_handler: ^12.0.3
  provider: ^6.1.5
  responsive_framework: ^1.5.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.3
  table_calendar: ^3.2.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  visibility_detector: ^0.4.0+2
  yandex_mapkit:
    git:
      url: https://github.com/DaniilPavlov/yandex_mapkit.git
      ref: 03e2620f1b7b776f26c3897c657b6243a82096d5

dev_dependencies:
  # ^10.6 / build_runner ^2.15.2 blocked by mobx_codegen analyzer range
  auto_route_generator: ^10.5.0
  build_runner: ^2.15.1
  dart_audit: ^0.2.0
  envied_generator: ^1.3.8
  flutter_test:
    sdk: flutter
  # flutter_native_splash: ^2.2.17
  # flutter_launcher_icons: ^0.14.3
  json_serializable: ^6.14.0
  meykuless_lint_rules:
    git:
      url: https://github.com/DaniilPavlov/meykuless_lint_rules.git
      ref: 3ba5652f8a54126678b8e96232d1a89f110875e9
  mobx_codegen: ^2.7.7

# flutter_icons:
#   android: "ic_launcher"
#   ios: true
#   image_path: "assets/app_logo.png"

flutter:
  generate: true
  uses-material-design: true
  # TODO: переключиться после решения вопроса с yandex_mapkit
  config:
    enable-swift-package-manager: false
  assets:
    - assets/
    - assets/calendar/
    - assets/nav_bar/
    - assets/icons/
    - assets/circuits/
    - assets/data/

  fonts:
    - family: HelveticaNeueCyr-Bold
      fonts:
        - asset: fonts/HelveticaNeueCyr-Bold.ttf

    - family: Inter-Regular
      fonts:
        - asset: fonts/Inter-Regular.ttf
